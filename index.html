<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医疗客群 · AI产品陪练助手</title>
<style>
  :root{
    --bg:#0d1b2a; --panel:#16263a; --panel2:#1d3350; --line:#274766;
    --brand:#c8102e; --brand2:#e63757; --gold:#d4a24a;
    --text:#eaf1f8; --sub:#9fb3c8; --ok:#3ecf8e; --warn:#f5a623;
    --user:#1f4e79; --ai:#1d3350;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{display:flex;align-items:center;gap:18px;padding:12px 22px;background:linear-gradient(90deg,#111f30,#16263a);border-bottom:2px solid var(--brand)}
  .logo{font-weight:700;font-size:18px;white-space:nowrap}
  .tag{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
  .steps{display:flex;gap:4px;margin-left:10px}
  .step{display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--sub);border:1px solid transparent;transition:.15s}
  .step:hover{color:var(--text)}
  .step.active{background:var(--panel2);color:#fff;border-color:var(--line)}
  .step .n{width:20px;height:20px;border-radius:50%;background:var(--line);color:#fff;font-size:12px;display:grid;place-items:center}
  .step.active .n{background:var(--brand)}
  .step.done .n{background:var(--ok)}
  .spacer{flex:1}
  .toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--sub);user-select:none}
  .sw{width:44px;height:24px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:.2s}
  .sw.on{background:var(--ok)}
  .sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
  .sw.on::after{left:23px}
  main{display:flex;flex:1;overflow:hidden}
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .stagebar{padding:11px 26px;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .stagebar b{color:var(--text)}
  .body{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column}
  .wrap{max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
  /* seek */
  .seek{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:16px}
  .seek input{flex:1;min-width:220px;background:#0f2236;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 13px;font-size:15px}
  .seek input:focus{outline:none;border-color:var(--brand2)}
  .gobtn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
  .gobtn:disabled{opacity:.5}
  .quick{margin-top:11px;color:var(--sub);font-size:13px}
  .quick span{color:var(--gold);cursor:pointer;margin:0 5px;text-decoration:underline dotted}
  /* profile */
  .profile{margin-top:18px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;animation:fade .3s}
  .profile .ph{background:linear-gradient(90deg,#1d3350,#16263a);padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .profile .ph .nm{font-size:18px;font-weight:700}
  .profile .ph .badge{font-size:12px;background:var(--brand);border-radius:6px;padding:2px 9px}
  .profile .pb{padding:14px 20px;font-size:14px;line-height:1.75}
  .disc{font-size:12px;color:var(--warn);margin:2px 20px 16px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.3);border-radius:8px;padding:9px 12px;line-height:1.5}
  /* recommend */
  .rec{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0;margin-bottom:10px;animation:fade .3s;overflow:hidden}
  .rec .top{display:flex;gap:14px;align-items:center;padding:13px 16px}
  .rec .rk{font-size:22px;font-weight:800;color:var(--gold);width:26px;text-align:center}
  .rec .rn{font-weight:600;font-size:15px}
  .rec .rr{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.6}
  .rec .fit{font-size:12px;background:var(--brand);border-radius:20px;padding:2px 10px;white-space:nowrap}
  .rec .viewbtn{font-size:12px;color:var(--gold);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap}
  .rec .viewbtn:hover{border-color:var(--gold)}
  .detail{border-top:1px solid var(--line);padding:14px 18px;background:#0f2236;font-size:13px;line-height:1.7;display:none}
  .detail.show{display:block}
  .detail .dt{color:var(--gold);font-weight:600;margin:8px 0 3px}
  .detail ul{margin:2px 0 0;padding-left:18px}
  /* chat */
  .chat{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:12px;min-height:110px}
  .msg{max-width:82%;padding:11px 15px;border-radius:12px;font-size:14px;line-height:1.65;white-space:pre-wrap;animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .msg.u{align-self:flex-end;background:var(--user);border:1px solid #2b5f92}
  .msg.a{align-self:flex-start;background:var(--ai);border:1px solid var(--line)}
  .msg.a .who{font-size:11px;color:var(--gold);margin-bottom:5px;font-weight:600}
  .composer{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
  textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px;font-size:14px;font-family:inherit;min-height:46px;max-height:150px;line-height:1.5}
  textarea:focus{outline:none;border-color:var(--brand2)}
  .send{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:0 20px;height:46px;font-size:14px;font-weight:600;cursor:pointer}
  .send:disabled{opacity:.5;cursor:not-allowed}
  .barbtn{display:flex;justify-content:flex-end;margin-top:14px}
  .endstep{background:transparent;border:1px solid var(--brand);color:var(--text);border-radius:8px;padding:10px 20px;cursor:pointer;font-size:14px}
  .endstep:hover{background:var(--brand)}
  .roleSel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .roleSel .lb{font-size:12px;color:var(--sub)}
  .chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--sub)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .endbtn{background:var(--gold);color:#0d1b2a;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .empty{margin:auto;text-align:center;color:var(--sub);max-width:520px;padding:26px}
  .empty h2{color:var(--text);font-weight:600}
  .typing{align-self:flex-start;color:var(--sub);font-size:13px;padding:4px 8px}
  .typing span{animation:blink 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  /* score */
  .scorecard{background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:22px;animation:fade .3s;max-width:640px;margin:10px auto}
  .scorecard .big{text-align:center}
  .scorecard .big .num{font-size:56px;font-weight:800;color:var(--gold);line-height:1}
  .scorecard .big .lv{font-size:15px;color:var(--text);margin-top:4px}
  .dims{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;justify-content:center}
  .dim{flex:1;min-width:104px;background:#0f2236;border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center}
  .dim .dn{font-size:12px;color:var(--sub)}
  .dim .dv{font-size:20px;font-weight:700;margin-top:3px}
  .sblock{margin-top:14px}
  .sblock .t{font-size:13px;font-weight:600;margin-bottom:5px}
  .sblock .c{font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap}
  .again{margin-top:18px;text-align:center;display:flex;gap:10px;justify-content:center}
  .again button{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 22px;cursor:pointer;font-size:14px}
  .again button.gray{background:transparent;border:1px solid var(--line)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50}
  .modal.show{display:grid}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:400px;max-width:92vw}
  .box h3{margin:0 0 4px}
  .box p{color:var(--sub);font-size:13px;margin:0 0 18px;line-height:1.5}
  .fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
  .fld input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:14px;margin-bottom:12px}
  .fld input:focus{outline:none;border-color:var(--brand2)}
  .grow{display:flex;gap:10px;justify-content:flex-end}
  .btn{padding:9px 18px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:13px}
  .btn.p{background:var(--brand);border-color:var(--brand)}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  /* ---- 营销纪要表单 ---- */
  .form{display:flex;flex-direction:column;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px}
  .frow{display:flex;flex-direction:column;gap:6px}
  .frow2{display:flex;gap:14px}
  .frow2>div{flex:1;display:flex;flex-direction:column;gap:6px}
  .form label{font-size:13px;color:var(--sub)}
  .form input,.form select,.ta{background:#0f2236;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit}
  .form input:focus,.form select:focus,.ta:focus{outline:none;border-color:var(--brand2)}
  .ta{resize:vertical;min-height:60px;line-height:1.55}
  .checks{display:flex;flex-wrap:wrap;gap:8px 16px}
  .ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text);cursor:pointer}
  .ck input{width:auto}
  .prow{background:#0f2236;border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .prow-h{display:flex;gap:8px;align-items:center}
  .prow-h .pn{flex:1}
  .rm{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:6px;width:32px;height:32px;cursor:pointer;flex:none;font-size:13px}
  .rm:hover{border-color:var(--brand);color:var(--brand2)}
  .addp{background:transparent;border:1px dashed var(--line);color:var(--gold);border-radius:8px;padding:9px;cursor:pointer;font-size:13px;width:100%}
  .addp:hover{border-color:var(--gold)}
  .memo{margin-top:18px;background:var(--panel2);border:1px solid var(--gold);border-radius:12px;overflow:hidden;animation:fade .3s}
  .memohd{background:linear-gradient(90deg,#1d3350,#16263a);padding:12px 18px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .memohd .acts{display:flex;gap:8px}
  .cpy{background:var(--brand);color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:12px;cursor:pointer}
  .cpy.g{background:transparent;border:1px solid var(--line);color:var(--text)}
  .memo pre{margin:0;padding:16px 18px;font-family:inherit;font-size:14px;line-height:1.8;white-space:pre-wrap;color:var(--text)}
  /* ---- 移动端适配 ---- */
  @media (max-width:640px){
    header{flex-wrap:wrap;gap:8px 10px;padding:10px 14px}
    .logo{font-size:16px;order:1}
    .toggle{order:2;margin-left:auto;font-size:12px}
    .tag{order:3;flex-basis:100%;font-size:10px;padding:2px 8px;align-self:flex-start}
    .spacer{display:none}
    .steps{order:4;flex-basis:100%;width:100%;margin-left:0;gap:5px}
    .step{flex:1;justify-content:center;padding:8px 2px;font-size:12px;gap:4px}
    .step .n{width:18px;height:18px;font-size:11px}
    .stagebar{padding:10px 14px;font-size:12px;gap:8px}
    .body{padding:16px 14px}
    .wrap{max-width:100%}
    .seek{font-size:15px;padding:13px 14px;gap:8px}
    .seek input{min-width:100%;flex-basis:100%;font-size:16px;padding:11px}
    .gobtn{flex:1;font-size:15px;padding:12px}
    .quick{font-size:12px;line-height:1.9}
    .profile .ph{padding:12px 15px}
    .profile .ph .nm{font-size:16px}
    .profile .pb{padding:13px 15px;font-size:14px}
    .disc{margin:2px 0 14px}
    .rec .top{flex-wrap:wrap;gap:8px 10px;padding:12px 13px}
    .rec .rk{width:auto}
    .rec .top>div[style]{flex:1 1 100%;order:3}
    .rec .fit{order:2}
    .rec .viewbtn{order:2;margin-left:auto}
    .detail{padding:12px 14px}
    .msg{max-width:90%}
    textarea{font-size:16px}
    .composer{gap:8px}
    .send{padding:0 16px}
    .endstep{width:100%;padding:12px}
    .barbtn{justify-content:stretch}
    .endbtn{width:100%;margin-top:6px}
    .scorecard{padding:16px}
    .scorecard .big .num{font-size:46px}
    .dims{gap:6px}
    .dim{min-width:calc(33% - 6px);padding:8px 6px}
    .dim .dv{font-size:17px}
    .again{flex-wrap:wrap}
    .again button{flex:1;min-width:120px}
    .box{padding:20px;width:94vw}
    .fld input{font-size:16px}
    .frow2{flex-direction:column;gap:14px}
    .form input,.form select,.ta{font-size:16px}
    .memohd{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="app">

    <span class="tag">Tokens由haoan友情赞助</span>

</div>

  inp.value="";document.getElementById("dSend").disabled=true;
  const first=!drillStarted;drillStarted=true;
  pushMsg("dChat","user",t);drillHist.push({role:"user",content:t});typing("dChat");
  let reply;
  try{reply=useAI?await llmChat(sysDrill(),drillHist):(await sleep(600),demoDrill());}
  catch(e){reply=demoDrill()+`\n\n（AI失败：${e.message}）`;}
  stopTyping();pushMsg("dChat","assistant",reply,persona().face+" "+persona().label);
  drillHist.push({role:"assistant",content:reply});
  document.getElementById("dSend").disabled=false;
  if(first){const bar=document.getElementById("stagebar");if(!bar.querySelector(".endbtn"))bar.insertAdjacentHTML("beforeend",' <button class="endbtn" onclick="endDrill()">结束对练并打分</button>');}
  inp.focus();
}
function recNames(){return (recProducts.length?recProducts.map(r=>PRODUCTS[r.k].name):Object.values(PRODUCTS).map(p=>p.name)).join("、");}
function sysDrill(){const pe=persona();
  return `你在扮演客户「${pe.label}」本人。以下是你的真实背景，请据此入戏、符合该客户的身份与关注点：\n${clientProfile.text.replace(/<br>/g,"\n")}\n\n招行客户经理正在向你营销这些金融科技产品（供你判断，不必主动提）：${recNames()}。\n请以真实客户口吻回应，提出符合你身份的真实异议与追问（价值、成本ROI、数据安全、系统对接、患者服务、落地难度等），不要轻易被说服，一次只说一段；对方话术到位、打消你顾虑时可逐步松口。全程保持角色，不要跳出、不要替对方说话。`;}
function demoDrill(){const p=PRODUCTS[recProducts.length?recProducts[0].k:"invoice"];const o=p.obj[Math.floor(Math.random()*p.obj.length)];
  const pool=[`你说的我大概明白，但——${o[0]}？`,`我们每天事挺多，你直接说，这东西对我们最实际的好处是啥？`,`${o[0]}这块我有点担心，你们怎么解决？`,`投入和效果怎么算？多久能见到效果？`,`这个跟我们现在的做法比，到底强在哪？`];
  return `（${persona().label}）`+pool[Math.floor(Math.random()*pool.length)]+`\n\n（演示内容；开启AI后AI会以该客户身份针对你每句话真实追问）`;}
async function endDrill(){
  if(!drillHist.length){toast("先开始对练再打分");return;}
  document.getElementById("wrap").innerHTML='<div class="empty">正在生成评分…</div>';
  let sc;try{sc=useAI?await scoreByAI():(await sleep(700),demoScore());}catch(e){sc=demoScore();}
  renderScore(sc);
}
async function scoreByAI(){
  const convo=drillHist.map(m=>(m.role==="user"?"客户经理：":"客户：")+m.content).join("\n");
  const sys=`你是招商银行医疗客群营销教练。以下是客户经理向客户「${persona().label}」营销我行金融科技产品的对练记录。请评分并严格输出JSON：{"total":0-100,"dims":{"开场破冰":0-20,"需求挖掘":0-20,"价值呈现":0-20,"异议处理":0-20,"促成推进":0-20},"good":"亮点","bad":"不足","tip":"改进建议(可直接照做)"}。只输出JSON。\n记录：\n${convo}`;
  const raw=await llm(sys,"请评分并输出JSON。");return JSON.parse(raw.match(/\{[\s\S]*\}/)[0]);
}
function demoScore(){const turns=drillHist.filter(m=>m.role==="user").length;const base=Math.min(88,52+turns*7);
  return{total:base,dims:{开场破冰:Math.min(18,10+turns),需求挖掘:Math.min(16,8+turns*2),价值呈现:Math.min(17,9+turns*2),异议处理:Math.min(17,8+turns*2),促成推进:Math.min(15,6+turns*2)},
    good:"能主动切入产品并回应客户提问；态度积极。",bad:"需求挖掘偏少，价值呈现偏笼统、缺量化。",
    tip:"1）先问'咱们目前怎么做/量多大'再讲方案；2）用'原来X小时→现在Y小时'量化价值；3）结尾给明确下一步。\n\n（演示评分；开启AI后为真实评分）"};}
function renderScore(sc){
  const lv=sc.total>=85?"优秀 · 可独立营销":sc.total>=70?"良好 · 小幅打磨":sc.total>=60?"及格 · 需多练":"待提升 · 建议重练";
  document.getElementById("wrap").innerHTML=`<div class="scorecard">
    <div class="big"><div class="num">${sc.total}</div><div class="lv">${lv}</div></div>
    <div class="dims">${Object.entries(sc.dims||{}).map(([k,v])=>`<div class="dim"><div class="dn">${k}</div><div class="dv">${v}</div></div>`).join("")}</div>
    <div class="sblock"><div class="t" style="color:var(--ok)">✅ 亮点</div><div class="c">${sc.good||""}</div></div>
    <div class="sblock"><div class="t" style="color:var(--warn)">⚠️ 不足</div><div class="c">${sc.bad||""}</div></div>
    <div class="sblock"><div class="t" style="color:var(--gold)">✏️ 改进建议</div><div class="c">${sc.tip||""}</div></div>
    <div class="again"><button onclick="resetDrill()">再练一次</button><button onclick="goStage(4)">生成营销纪要 →</button><button class="gray" onclick="goStage(1)">换个客户</button></div>
  </div>`;}
function resetDrill(){drillHist=[];drillStarted=false;renderStage();}

/* ---------- 阶段4：营销纪要 ---------- */
function fv(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function renderS4(bar,w){
  bar.innerHTML='<b>④ 营销纪要</b> · 填写机构、客户与各产品进展，一键生成规范纪要';
  const today=new Date().toISOString().slice(0,10);
  const sc=clientProfile?splitClient(clientProfile.name):{org:'',person:''};
  w.innerHTML=`
    <div class="form">
      <div class="frow2">
        <div><label>机构名称</label><input id="mOrg" value="${sc.org}" placeholder="如：河北燕达医院"></div>
        <div><label>客户名称（联系人）</label><input id="mClient" value="${sc.person}" placeholder="如：李海玲院长"></div>
      </div>
      <div class="frow2">
        <div><label>拜访日期</label><input id="mDate" type="date" value="${today}"></div>
        <div><label>客户经理</label><input id="mRm" placeholder="你的姓名"></div>
      </div>
      <div class="frow"><label>营销产品（可增删，每个产品下填进展 / 跟进）</label>
        <div id="prodRows"></div>
        <button class="addp" onclick="addProdRow()">＋ 添加产品</button>
      </div>
      <div class="frow2">
        <div><label>客户意向</label><select id="mIntent"><option>意向强</option><option selected>一般</option><option>待观望</option><option>暂无</option></select></div>
        <div></div>
      </div>
      <div class="frow"><label>客户整体进展与跟进</label><textarea id="mOverall" class="ta" placeholder="如：客户对整体方案认可，拟下周安排现场调研，本月内出具方案…"></textarea></div>
      <div class="barbtn"><button class="gobtn" onclick="genMemo()">生成营销纪要</button></div>
    </div>
    <div id="memoOut"></div>`;
  const pre=recProducts.length?recProducts.map(r=>PRODUCTS[r.k].name):[];
  if(pre.length)pre.forEach(n=>addProdRow(n));else addProdRow('');
}
function addProdRow(name='',prog=''){
  const c=document.getElementById('prodRows');if(!c)return;
  const d=document.createElement('div');d.className='prow';
  d.innerHTML=`<div class="prow-h"><input class="pn" placeholder="产品名称"><button class="rm" onclick="removeProdRow(this)" title="删除该产品">✕</button></div><textarea class="pp ta" placeholder="该产品进展 / 跟进…"></textarea>`;
  c.appendChild(d);d.querySelector('.pn').value=name;d.querySelector('.pp').value=prog;
}
function removeProdRow(btn){const r=btn.closest('.prow');if(r)r.remove();}
function splitClient(name){
  const m=name.match(/^(.*?(?:医院|卫生院|保健院|中心|卫健委|卫生健康委员会|疾控中心|疾控|集团|分院|门诊部|诊所))(.*)$/);
  if(m&&m[1]&&m[2].trim())return{org:m[1],person:m[2].trim()};
  if(isPerson(name))return{org:'',person:name};
  return{org:name,person:''};
}
function memoData(){
  const prods=[...document.querySelectorAll('#prodRows .prow')].map(r=>({
    name:r.querySelector('.pn').value.trim(),prog:r.querySelector('.pp').value.trim()
  })).filter(p=>p.name);
  return {org:fv('mOrg'),client:fv('mClient'),date:fv('mDate'),rm:fv('mRm'),
    intent:fv('mIntent'),prods,overall:fv('mOverall'),
    profile:clientProfile?clientProfile.text.replace(/<br>/g,'\n'):''};
}
async function genMemo(){
  const d=memoData();const out=document.getElementById('memoOut');
  out.innerHTML='<div class="empty">正在生成纪要…</div>';
  let memo;
  try{memo=useAI?await llm(sysMemo(d),'请根据要点生成营销纪要。'):(await sleep(600),demoMemo(d));}
  catch(e){memo=demoMemo(d)+`\n\n（AI失败：${e.message}）`;}
  renderMemo(memo);
}
function sysMemo(d){const pl=d.prods.map(p=>`${p.name}（进展/跟进：${p.prog||'无'}）`).join('；')||'（未填）';
  return `你是招商银行机构客户部客户经理助手。请根据以下要点，生成一份专业、简洁、可直接归档的《客户营销纪要》，用书面公文语气，条理清晰；可补充常见的跟进建议，但不得杜撰未提供的事实。\n【客户信息调研（第一部分获取）】\n${d.profile||'（无）'}\n\n机构名称：${d.org||'（未填）'}\n客户名称：${d.client||'（未填）'}\n拜访日期：${d.date}\n客户经理：${d.rm||'（未填）'}\n营销产品及各自进展：${pl}\n客户意向：${d.intent}\n客户整体进展与跟进：${d.overall||'无'}\n\n结构包含：一、基本信息；二、客户简况（结合上述客户信息调研，用2-3句话概括客户机构性质、规模与营销机会，不要照抄原文）；三、营销产品与进展（逐个产品列示其进展/跟进）；四、客户意向；五、客户整体进展与跟进。`;}
function demoMemo(d){const dt=d.date||new Date().toISOString().slice(0,10);
  const pl=d.prods.length?d.prods.map(p=>`· ${p.name}\n  进展/跟进：${p.prog||'—'}`).join('\n'):'· —';
  const brief=(d.profile||'—').replace(/\n{2,}/g,'\n').trim();
  return `客户营销纪要\n\n一、基本信息\n机构名称：${d.org||'—'}\n客户名称：${d.client||'—'}\n拜访日期：${dt}\n客户经理：${d.rm||'—'}\n\n二、客户简况\n${brief}\n\n三、营销产品与进展\n${pl}\n\n四、客户意向\n${d.intent||'—'}\n\n五、客户整体进展与跟进\n${d.overall||'—'}\n\n（本纪要由医疗客群AI产品陪练助手根据本次营销结果生成，供跟进与归档参考；开启AI后将自动润色为规范公文语气。）`;}
function renderMemo(text){const out=document.getElementById('memoOut');
  out.innerHTML=`<div class="memo"><div class="memohd">营销纪要<div class="acts"><button class="cpy" onclick="copyMemo()">复制</button><button class="cpy g" onclick="downloadMemo()">下载</button></div></div><pre id="memoText"></pre></div>`;
  document.getElementById('memoText').textContent=text;}
function copyMemo(){const t=document.getElementById('memoText').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('.cpy');const o=b.textContent;b.textContent='已复制';setTimeout(()=>b.textContent=o,1500);});}
function downloadMemo(){const t=document.getElementById('memoText').textContent;const nm=(fv('mOrg')||fv('mClient')||'客户')+'_营销纪要.txt';
  const b=new Blob([t],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nm;a.click();URL.revokeObjectURL(a.href);}


/* ================= 通用 ================= */
function chatKey(fn){return e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();fn();}};}
function renderChat(id,hist,drill){const c=document.getElementById(id);if(!c)return;c.innerHTML="";
  hist.forEach(m=>{const d=document.createElement("div");d.className="msg "+(m.role==="user"?"u":"a");
    const who=m.role==="assistant"?(drill?persona().face+" "+persona().label:"AI"):"";
    d.innerHTML=(who?`<div class="who">${who}</div>`:"")+format(m.content);c.appendChild(d);});c.scrollTop=c.scrollHeight;}
function pushMsg(id,role,text,who){const c=document.getElementById(id);const e=c.querySelector(".empty");if(e)e.remove();
  const d=document.createElement("div");d.className="msg "+(role==="user"?"u":"a");
  d.innerHTML=(role==="assistant"&&who?`<div class="who">${who}</div>`:"")+format(text);c.appendChild(d);c.scrollTop=c.scrollHeight;}
function format(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function typing(id){const c=document.getElementById(id);const d=document.createElement("div");d.className="typing";d.id="typing";d.innerHTML="AI思考中<span>.</span><span>.</span><span>.</span>";c.appendChild(d);c.scrollTop=c.scrollHeight;}
function stopTyping(){const t=document.getElementById("typing");if(t)t.remove();}
function kb(k){const p=PRODUCTS[k];return `${p.name}｜定位:${p.def}｜痛点:${p.pain.join("、")}｜必说:${p.say.join("、")}｜必做:${p.do.join("、")}｜异议:${p.obj.map(o=>o[0]+"→"+o[1]).join("；")}｜客群:${p.client}`;}
function kbAll(){return Object.keys(PRODUCTS).map(kb).join("\n");}
function sysRec(){return `你是招商银行医疗客群产品配置助手。客户画像：\n${clientProfile.text.replace(/<br>/g,"\n")}\n\n可选产品：\n`+Object.entries(PRODUCTS).map(([k,p])=>`${k}: ${p.name} - ${p.def}`).join("\n");}
async function llm(system,user){return llmChat(system,[{role:"user",content:user}]);}
async function llmChat(system,hist){
  const url=AI.url.replace(/\/$/,"")+"/v1/chat/completions";
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+AI.key},
    body:JSON.stringify({model:AI.model,messages:[{role:"system",content:system},...hist.slice(-8)],temperature:0.7})});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const j=await res.json();return j.choices?.[0]?.message?.content||"(空回复)";}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ================= 启动 ================= */
document.getElementById("gateAns").addEventListener("keydown",e=>{if(e.key==="Enter")checkGate();});
document.getElementById("gate").addEventListener("click",e=>{if(e.target.id==="gate")closeGate();});
renderStage();
</script>
