<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医疗客群 · AI产品陪练助手</title>
<style>
  :root{--bg:#0d1b2a;--panel:#16263a;--panel2:#1d3350;--line:#274766;--brand:#c8102e;--brand2:#e63757;--gold:#d4a24a;--text:#eaf1f8;--sub:#9fb3c8;--ok:#3ecf8e;--warn:#f5a623;--user:#1f4e79;--ai:#1d3350;}
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{display:flex;align-items:center;gap:18px;padding:12px 22px;background:linear-gradient(90deg,#111f30,#16263a);border-bottom:2px solid var(--brand)}
  .logo{font-weight:700;font-size:18px;white-space:nowrap}
  .tag{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
  .steps{display:flex;gap:4px;margin-left:10px}
  .step{display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--sub);border:1px solid transparent;transition:.15s}
  .step:hover{color:var(--text)}
  .step.active{background:var(--panel2);color:#fff;border-color:var(--line)}
  .step .n{width:20px;height:20px;border-radius:50%;background:var(--line);color:#fff;font-size:12px;display:grid;place-items:center}
  .step.active .n{background:var(--brand)}
  .step.done .n{background:var(--ok)}
  .spacer{flex:1}
  .toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--sub);user-select:none}
  .sw{width:44px;height:24px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;transition:.2s}
  .sw.on{background:var(--ok)}
  .sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
  .sw.on::after{left:23px}
  main{display:flex;flex:1;overflow:hidden}
  .content{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .stagebar{padding:11px 26px;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .stagebar b{color:var(--text)}
  .body{flex:1;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column}
  .wrap{max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1}
  .seek{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:16px}
  .seek input{flex:1;min-width:220px;background:#0f2236;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 13px;font-size:15px}
  .seek input:focus{outline:none;border-color:var(--brand2)}
  .gobtn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
  .gobtn:disabled{opacity:.5}
  .quick{margin-top:11px;color:var(--sub);font-size:13px}
  .quick span{color:var(--gold);cursor:pointer;margin:0 5px;text-decoration:underline dotted}
  .profile{margin-top:18px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;animation:fade .3s}
  .profile .ph{background:linear-gradient(90deg,#1d3350,#16263a);padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .profile .ph .nm{font-size:18px;font-weight:700}
  .profile .ph .badge{font-size:12px;background:var(--brand);border-radius:6px;padding:2px 9px}
  .profile .pb{padding:14px 20px;font-size:14px;line-height:1.75}
  .disc{font-size:12px;color:var(--warn);margin:2px 20px 16px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.3);border-radius:8px;padding:9px 12px;line-height:1.5}
  .rec{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;animation:fade .3s;overflow:hidden}
  .rec .top{display:flex;gap:12px;align-items:center;padding:13px 16px}
  .rec .rk{font-size:20px;font-weight:800;color:var(--gold);width:24px;text-align:center}
  .rec .rn{font-weight:600;font-size:15px}
  .rec .area{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-left:8px}
  .rec .rr{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.6}
  .rec .fit{font-size:12px;background:var(--brand);border-radius:20px;padding:2px 10px;white-space:nowrap}
  .rec .act{font-size:12px;color:var(--gold);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  .rec .act:hover{border-color:var(--gold)}
  .rec .act.del{color:var(--brand2)}
  .rec .act.del:hover{border-color:var(--brand2)}
  .detail{border-top:1px solid var(--line);padding:12px 18px;background:#0f2236;font-size:13px;line-height:1.75;display:none}
  .detail.show{display:block}
  .addbar{display:flex;gap:8px;align-items:center;margin:4px 0 2px}
  .addbar select{flex:1;background:#0f2236;border:1px dashed var(--line);border-radius:8px;color:var(--gold);padding:10px;font-size:13px;font-family:inherit}
  .chat{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:12px;min-height:110px}
  .msg{max-width:82%;padding:11px 15px;border-radius:12px;font-size:14px;line-height:1.65;white-space:pre-wrap;animation:fade .3s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .msg.u{align-self:flex-end;background:var(--user);border:1px solid #2b5f92}
  .msg.a{align-self:flex-start;background:var(--ai);border:1px solid var(--line)}
  .msg.a .who{font-size:11px;color:var(--gold);margin-bottom:5px;font-weight:600}
  .composer{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
  textarea{flex:1;resize:none;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px;font-size:14px;font-family:inherit;min-height:46px;max-height:150px;line-height:1.5}
  textarea:focus{outline:none;border-color:var(--brand2)}
  .send{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:0 20px;height:46px;font-size:14px;font-weight:600;cursor:pointer}
  .send:disabled{opacity:.5;cursor:not-allowed}
  .barbtn{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:14px}
  .endstep{background:transparent;border:1px solid var(--brand);color:var(--text);border-radius:8px;padding:10px 18px;cursor:pointer;font-size:14px}
  .endstep:hover{background:var(--brand)}
  .endstep.sec{border-color:var(--line);color:var(--sub)}
  .endstep.gold{border-color:var(--gold);color:var(--gold)}
  .endstep.gold:hover{background:var(--gold);color:#0d1b2a}
  .roleSel{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{padding:5px 12px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--sub)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .endbtn{background:var(--gold);color:#0d1b2a;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
  .empty{margin:auto;text-align:center;color:var(--sub);max-width:520px;padding:26px}
  .empty h2{color:var(--text);font-weight:600}
  .typing{align-self:flex-start;color:var(--sub);font-size:13px;padding:4px 8px}
  .typing span{animation:blink 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
  .scorecard{background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:22px;animation:fade .3s;max-width:640px;margin:10px auto}
  .scorecard .big{text-align:center}
  .scorecard .big .num{font-size:56px;font-weight:800;color:var(--gold);line-height:1}
  .scorecard .big .lv{font-size:15px;color:var(--text);margin-top:4px}
  .dims{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap;justify-content:center}
  .dim{flex:1;min-width:104px;background:#0f2236;border:1px solid var(--line);border-radius:9px;padding:10px;text-align:center}
  .dim .dn{font-size:12px;color:var(--sub)}
  .dim .dv{font-size:20px;font-weight:700;margin-top:3px}
  .sblock{margin-top:14px}.sblock .t{font-size:13px;font-weight:600;margin-bottom:5px}.sblock .c{font-size:14px;line-height:1.7;white-space:pre-wrap}
  .again{margin-top:18px;text-align:center;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .again button{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-size:14px}
  .again button.gray{background:transparent;border:1px solid var(--line)}
  .form{display:flex;flex-direction:column;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px}
  .frow{display:flex;flex-direction:column;gap:6px}
  .frow2{display:flex;gap:14px}.frow2>div{flex:1;display:flex;flex-direction:column;gap:6px}
  .form label{font-size:13px;color:var(--sub)}
  .form input,.form select,.ta{background:#0f2236;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:14px;font-family:inherit}
  .form input:focus,.form select:focus,.ta:focus{outline:none;border-color:var(--brand2)}
  .ta{resize:vertical;min-height:60px;line-height:1.55}
  .prow{background:#0f2236;border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .prow-h{display:flex;gap:8px;align-items:center}.prow-h .pn{flex:1}
  .rm{background:transparent;border:1px solid var(--line);color:var(--sub);border-radius:6px;width:32px;height:32px;cursor:pointer;flex:none;font-size:13px}
  .rm:hover{border-color:var(--brand);color:var(--brand2)}
  .addp{background:transparent;border:1px dashed var(--line);color:var(--gold);border-radius:8px;padding:9px;cursor:pointer;font-size:13px;width:100%}
  .addp:hover{border-color:var(--gold)}
  .memo{margin-top:18px;background:var(--panel2);border:1px solid var(--gold);border-radius:12px;overflow:hidden;animation:fade .3s}
  .memohd{background:linear-gradient(90deg,#1d3350,#16263a);padding:12px 18px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .memohd .acts{display:flex;gap:8px}
  .cpy{background:var(--brand);color:#fff;border:none;border-radius:7px;padding:6px 14px;font-size:12px;cursor:pointer}.cpy.g{background:transparent;border:1px solid var(--line);color:var(--text)}
  .memo pre{margin:0;padding:16px 18px;font-family:inherit;font-size:14px;line-height:1.8;white-space:pre-wrap}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:60}
  .modal.show{display:grid}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:400px;max-width:92vw}
  .box h3{margin:0 0 4px}.box p{color:var(--sub);font-size:13px;margin:0 0 18px;line-height:1.5}
  .fld label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
  .fld input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:14px;margin-bottom:12px}
  .fld input:focus{outline:none;border-color:var(--brand2)}
  .grow{display:flex;gap:10px;justify-content:flex-end}
  .btn{padding:9px 18px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:13px}
  .btn.p{background:var(--brand);border-color:var(--brand)}
  /* 服务方案（对客文档，浅色） */
  #proposal{position:fixed;inset:0;background:#5a6672;z-index:80;overflow:auto;display:none}
  #proposal.show{display:block}
  .pbar{position:sticky;top:0;background:#16263a;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
  .pbar .pt{margin-right:auto;color:var(--sub);font-size:13px}
  .doc{background:#fff;color:#1a1a1a;max-width:820px;margin:22px auto;padding:0 0 40px;box-shadow:0 6px 30px rgba(0,0,0,.4);border-radius:2px}
  .doc .cover{background:linear-gradient(135deg,#8f0f22,#c8102e);color:#fff;padding:56px 48px 40px;border-radius:2px 2px 0 0}
  .doc .cover .k{font-size:13px;letter-spacing:3px;opacity:.85}
  .doc .cover h1{font-size:30px;margin:14px 0 26px;line-height:1.35}
  .doc .cover .meta{font-size:14px;line-height:2;opacity:.95}
  .doc .sec{padding:26px 48px}
  .doc .sec h2{font-size:18px;color:#c8102e;border-left:4px solid #c8102e;padding-left:10px;margin:0 0 14px}
  .doc .sec p{font-size:14px;line-height:1.9;margin:0 0 10px;color:#333}
  .doc .pitem{border:1px solid #e5e5e5;border-radius:8px;padding:14px 16px;margin-bottom:12px}
  .doc .pitem .h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .doc .pitem .idx{background:#c8102e;color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
  .doc .pitem .nm{font-weight:700;font-size:15px}
  .doc .pitem .ar{font-size:11px;color:#888;border:1px solid #ddd;border-radius:20px;padding:1px 8px}
  .doc .pitem .ds{font-size:13px;line-height:1.85;color:#444;margin:0}
  .doc .foot{padding:20px 48px 36px;color:#888;font-size:12px;line-height:1.7;border-top:1px solid #eee;margin-top:8px}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  @media (max-width:640px){
    header{flex-wrap:wrap;gap:8px 10px;padding:10px 14px}
    .logo{font-size:16px;order:1}.toggle{order:2;margin-left:auto;font-size:12px}
    .tag{order:3;flex-basis:100%;font-size:10px;padding:2px 8px;align-self:flex-start}
    .spacer{display:none}
    .steps{order:4;flex-basis:100%;width:100%;margin-left:0;gap:5px}
    .step{flex:1;justify-content:center;padding:8px 2px;font-size:12px;gap:4px}.step .n{width:18px;height:18px;font-size:11px}
    .stagebar{padding:10px 14px;font-size:12px;gap:8px}
    .body{padding:16px 14px}.wrap{max-width:100%}
    .seek{font-size:15px;padding:13px 14px;gap:8px}.seek input{min-width:100%;flex-basis:100%;font-size:16px;padding:11px}.gobtn{flex:1;font-size:15px;padding:12px}
    .profile .pb{padding:13px 15px}.disc{margin:2px 0 14px}
    .rec .top{flex-wrap:wrap;gap:8px 10px;padding:12px 13px}.rec .top>div[style]{flex:1 1 100%;order:5}
    .msg{max-width:90%}textarea{font-size:16px}.send{padding:0 16px}
    .barbtn{justify-content:stretch}.endstep{flex:1;min-width:130px;text-align:center}
    .scorecard{padding:16px}.dim{min-width:calc(33% - 6px)}
    .frow2{flex-direction:column;gap:14px}.form input,.form select,.ta{font-size:16px}
    .box{padding:20px;width:94vw}.fld input{font-size:16px}
    .doc .cover{padding:36px 22px}.doc .cover h1{font-size:23px}.doc .sec{padding:20px 22px}.doc .foot{padding:18px 22px}
  }
  @media print{
    body{overflow:visible;height:auto}
    .app{display:none!important}
    #proposal{position:static;display:block!important;background:#fff;overflow:visible}
    .pbar{display:none!important}
    .doc{box-shadow:none;margin:0;max-width:100%}
    .doc .pitem{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">医疗客群深度求索</div>
    <span class="tag">Tokens由haoan友情赞助</span>
    <span id="whoami" class="tag" style="border-color:var(--gold);color:var(--gold);display:none"></span>
    <div class="steps">
      <div class="step active" data-s="1" onclick="goStage(1)"><span class="n">1</span>客户信息</div>
      <div class="step" data-s="2" onclick="goStage(2)"><span class="n">2</span>推荐产品</div>
      <div class="step" data-s="3" onclick="goStage(3)"><span class="n">3</span>模拟营销</div>
      <div class="step" data-s="4" onclick="goStage(4)"><span class="n">4</span>营销纪要</div>
    </div>
    <div class="spacer"></div>
    <div class="toggle">AI大模型<div id="aiSw" class="sw" onclick="toggleAI()"></div><span id="aiTxt" style="color:var(--sub)">已关闭</span></div>
  </header>
  <main><section class="content">
    <div class="stagebar" id="stagebar"></div>
    <div class="body"><div class="wrap" id="wrap"></div></div>
  </section></main>
</div>

<div class="modal" id="loginModal"><div class="box">
  <h3>员工登录</h3>
  <p>请输入你的姓名进入。姓名不在员工清单中将无法使用。登录后即可使用，无需暗号。</p>
  <div class="fld"><label>姓名</label><input id="loginName" placeholder="请输入你的姓名" autocomplete="off"></div>
  <div id="loginErr" style="display:none;color:var(--brand2);font-size:13px;margin:-6px 0 10px">未找到该员工，无法进入～</div>
  <div class="grow"><button class="btn p" onclick="doLogin()">进入</button></div>
</div></div>

<div class="modal" id="textInputModal"><div class="box" style="width:560px;max-width:94vw">
  <h3>上传 / 输入文字</h3>
  <p>可直接粘贴或输入文字；也可导入 .txt / .docx（旧版 .doc 请另存为 .docx 或直接粘贴）。确定后自动填入下方表单。</p>
  <textarea id="tiArea" style="width:100%;min-height:170px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font-size:14px;font-family:inherit;resize:vertical" placeholder="在此粘贴或输入会议文字…"></textarea>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" onclick="pickTextDoc()">从文件导入 (.txt/.docx)</button></div>
  <div class="grow"><button class="btn" onclick="closeTextInput()">取消</button><button class="btn p" onclick="confirmTextInput()">确定填入</button></div>
</div></div>

<input type="file" id="memoAudio" accept="audio/*" style="display:none">
<input type="file" id="memoTextFile" accept=".txt,.doc,.docx" style="display:none">

<div id="proposal">
  <div class="pbar"><span class="pt">对客服务方案预览 · 可打印或另存为 PDF</span>
    <button class="btn p" onclick="window.print()">打印 / 导出PDF</button>
    <button class="btn" onclick="closeProposal()">关闭</button>
  </div>
  <div id="docBox"></div>
</div>

<script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
<script>
/* ============ 内置配置 ============ */
/* 出于安全考虑，密钥不再写在代码里；首次使用时会提示输入，并仅保存在你本机浏览器（localStorage） */
const AI={url:"https://api.deepseek.com",model:"deepseek-v4-flash",get key(){return localStorage.getItem("AI_KEY")||"";}};
const GROQ={url:"https://api.groq.com/openai/v1/audio/transcriptions",model:"whisper-large-v3",get key(){return localStorage.getItem("GROQ_KEY")||"";}};
function ensureKey(storeName,label){let k=localStorage.getItem(storeName);
  if(!k){k=(prompt("请输入你的 "+label+" API Key（仅保存在本机浏览器，不会上传）：")||"").trim();if(k)localStorage.setItem(storeName,k);}
  return k;}
let useAI=false;

/* ============ 身份登录 ============ */
const ROSTER=[
  {name:"马浩铵",role:"客户经理",dept:"机构部",gender:"男",age:27,field:"教育医疗"},
  {name:"王鑫",  role:"主管",    dept:"机构部",gender:"",age:"",field:""},
  {name:"金燕",  role:"部门总",  dept:"机构部",gender:"",age:"",field:""}
];
let currentUser=null;
function idInject(){
  if(!currentUser) return "";
  const u=currentUser;
  const head="\n\n【当前使用者】"+u.name+"，"+(u.dept||"")+u.role+(u.field?("，负责"+u.field+"客群"):"")+"。";
  let g;
  if(u.role.indexOf("客户经理")>=0) g="请以一线客户经理视角作答：可深入具体产品功能、参数与可直接照着讲的话术、异议应对，并给出可落地执行动作。";
  else if(u.role.indexOf("主管")>=0) g="请以团队主管视角作答：可涉及产品但不必深入功能细节，侧重营销打法、客户优先级与团队协同。";

function showLogin(){const e=document.getElementById("loginErr");if(e)e.style.display="none";
  const m=document.getElementById("loginModal");if(m)m.classList.add("show");
  const i=document.getElementById("loginName");if(i){i.value="";setTimeout(function(){i.focus();},60);}}
function doLogin(){const n=(document.getElementById("loginName").value||"").trim();
  const u=ROSTER.find(function(x){return x.name===n;});
  if(!u){document.getElementById("loginErr").style.display="block";return;}
  currentUser=u;document.getElementById("loginModal").classList.remove("show");
  const w=document.getElementById("whoami");if(w){w.textContent=u.name+" · "+(u.dept||"")+u.role;w.style.display="";}}
function logout(){currentUser=null;setAIState(false);showLogin();}

。而增值账户的资金将被按照最小分割单位10万元/份分成N份，全部按照对应期限的定期存款利率进行计息。如果账户需要对外转账或发生支付行为，账户会优先使用签约账户的资金进行支付，当签约账户资金不足时，将从增值账户调拨n小份资金进行支付（按照后进先出顺序进行调拨，避免利息损失），增值账户中剩余（N-n）份资金将不受影响，继续按照既定期限利率计息。组合存款增值账户可选择3个月、6个月、1年期、2年期共计4种期限进行转存，根据可选期限的种类，组合存款分为A款和B款，A款仅可选择一种期限进行转存，而B款可选择多种期限，按照比例分配至不同期限当中。"}]}]},"authority":{"label":"卫生主管部门","cats":[{"name":"监管与合规","items":[{"area":"发票核验","name":"医招智付-发票智能管理","desc":"招商银行医招智付数电发票智能管理模块直接对接国家税务总局，提供进项和销项数电发票管理、电子档案管理等功能，支持对接医院财务、科研、采购、培训等业财系统，覆盖发票接收、报销、入账、归档等全程数字化闭环管理，并自动完成发票内容识别、核验、查重，提供数电发票全生命周期管理服务。其中进项发票管理包括发票多渠道采集（邮箱、移动采集、批量上传、扫描仪等）、智能校验信息（黑名单、关键词等）、直连税务总局一键取票、发票入账标识（防红冲）、快速勾选抵扣等功能；销项发票管理支持不同开票渠道、多形式开票、拆分合并开票、自动开票等功能。"},{"area":"供采管理","name":"医招智付-供应商协同管理","desc":"招商银行医招智付供应商协同管理模块打通医院与医药供应商内部系统，提供信息协同、供采协同、货票协同、证件协同功能，帮助医院实现自动入库，提升医院与医药供应商采购结算效率。医招智付可支持医院实时获取订单、药品/耗材价格调整等信息，实现通过扫码枪扫描送货单二维码获取送货单及关联信息，自动推送至HIS/HRP 进行入库，自动校验发票金额、内容、抬头是否一致，支持发票验真查重，实现药品、耗材资质证书线上化，证件临期自动提醒双方更新证件等。"},{"area":"运营监管","name":"OPA机器人","desc":"招商银行OPA机器人可自动完成跨系统数据的采集、清洗、汇总与报表生成，辅助卫生主管部门高效处理辖内医院上报的大量经济运行数据，实现对医院收支、成本、负债等关键指标的统一监测；并将监测结果可视化呈现，形成经济运行监管大屏，助力主管部门实时掌握辖内医院运营态势，提升监管的自动化、标准化与智能化水平。"}]},{"name":"数字化赋能","items":[{"area":"宣传答疑","name":"AI数字人","desc":"招商银行AI数字人集成了计算机视觉、语音识别、自然语言处理等多模态AI能力，通过语音克隆、语音交互、形象建模、表情和动作驱动等先进技术，创造仿真人形象和声音的数字劳动力。可应用于视频宣传、智能客服等多场景。"},{"area":"宣传答疑","name":"AI智能文本客服","desc":"招商银行AI智能文本客服是一款实现文字智能应答的产品，可灵活部署在微信公众号、小程序、办公系统、官方网站等线上渠道，提供7*24小时不间断服务，以文字、图片、链接等形式实时解答职工关于费用报销、差旅标准、科研经费等咨询问题，提供高效便捷的智能化自助咨询服务。"},{"area":"基层触达","name":"AI智能外呼客服","desc":"招商银行AI智能外呼客服通过AI机器人主动发起呼叫，实现大批量、标准化电话外呼触达，可助力下属基层医疗机构主动触达社区患者，开展随访、通知与健康宣教，提升基层能力与就医便民。"},{"area":"急救管理","name":"出诊有招","desc":"招商银行出诊有招系统是由招商银行打造的智慧急救便捷收费项目，利用招商银行聚合支付移动便携、通讯灵活、可打印票条及支持定制化开发等特性，支持急救信息与收费信息的即时同步，实现了移动开单、即时支付、快速开票、便捷对账等功能。"}]},{"name":"管理运营服务","items":[{"area":"县域医共体/城市医疗集团","name":"财资管理云CBS","desc":"招商银行财资管理云CBS是针对客户资金统一管理打造的跨银行财资管理平台，可与财务、费控等内部系统对接，通过一个Ukey、一个系统界面统一管理各家银行账户，实现全银行账户资金的统一可视和集中管理。可作为紧密型县域医共体/城市医疗集团资金统筹司库方案，实现成员单位账户与结算的统一管理、资金集中可视与统筹调拨。"},{"area":"党务管理","name":"智慧党建服务平台","desc":"招 /* ============ 顶部 / AI 开关 ============ */
function setAIState(v){useAI=v;document.getElementById("aiSw").classList.toggle("on",v);

function goStage(s){
  if(s>=2&&!clientProfile){toast("请先在第①步获取客户信息");return;}
  stage=s;
  document.querySelectorAll(".step").forEach(el=>{const n=+el.dataset.s;el.classList.toggle("active",n===s);
    el.classList.toggle("done",(n===1&&clientProfile)||(n===2&&recProducts.length));});
  renderStage();
}

    <div class="frow2"><div><label>客户意向</label><select id="mIntent"><option>意向强</option><option selected>一般</option><option>待观望</option><option>暂无</option></select></div><div></div></div>
    <div class="frow"><label>客户整体进展与跟进</label><textarea id="mOverall" class="ta" placeholder="如：客户对整体方案认可，拟下周安排现场调研，本月内出具方案…"></textarea></div>
    <div class="barbtn"><button class="endstep gold" onclick="genProposal()">生成服务方案（对客）</button><button class="gobtn" onclick="genMemo()">生成营销纪要</button></div>
  </div><div id="memoOut"></div>`;
  const pre=recProducts.length?recProducts.map(r=>r.name):[];
  if(pre.length)pre.forEach(n=>addProdRow(n));else addProdRow('');
}
function addProdRow(name='',prog=''){const c=document.getElementById('prodRows');if(!c)return;const d=document.createElement('div');d.className='prow';
  d.innerHTML=`<div class="prow-h"><input class="pn" placeholder="产品名称"><button class="rm" onclick="removeProdRow(this)" title="删除该产品">✕</button></div><textarea class="pp ta" placeholder="该产品进展 / 跟进…"></textarea>`;
  c.appendChild(d);d.querySelector('.pn').value=name;d.querySelector('.pp').value=prog;}
function removeProdRow(b){const r=b.closest('.prow');if(r)r.remove();}
function splitClient(name){const m=name.match(/^(.*?(?:医院|卫生院|保健院|中心|卫健委|卫生健康委员会|疾控中心|疾控|集团|分院|门诊部|诊所))(.*)$/);
  if(m&&m[1]&&m[2].trim())return{org:m[1],person:m[2].trim()};if(isPerson(name))return{org:'',person:name};return{org:name,person:''};}
function memoData(){const prods=[...document.querySelectorAll('#prodRows .prow')].map(r=>({name:r.querySelector('.pn').value.trim(),prog:r.querySelector('.pp').value.trim()})).filter(p=>p.name);
  return{org:fv('mOrg'),client:fv('mClient'),date:fv('mDate'),rm:fv('mRm'),intent:fv('mIntent'),prods,overall:fv('mOverall'),profile:clientProfile?plain(clientProfile.text):''};}
async function genMemo(){const d=memoData();const out=document.getElementById('memoOut');out.innerHTML='<div class="empty">正在生成纪要…</div>';
  let memo;try{memo=useAI?await llm(sysMemo(d),'请根据要点生成营销纪要。'):(await sleep(600),demoMemo(d));}catch(e){memo=demoMemo(d)+`\n\n（AI失败：${e.message}）`;}renderMemo(memo);}
function sysMemo(d){const pl=d.prods.map(p=>`${p.name}（进展/跟进：${p.prog||'无'}）`).join('；')||'（未填）';
  return `你是招商银行机构客户部客户经理助手。请根据以下要点，生成专业、简洁、可直接归档的《客户营销纪要》，用书面公文语气；可补充常见跟进建议，但不得杜撰未提供的事实。\n【客户信息调研（第一部分获取）】\n${d.profile||'（无）'}\n\n机构名称：${d.org||'（未填）'}\n客户名称：${d.client||'（未填）'}\n拜访日期：${d.date}\n客户经理：${d.rm||'（未填）'}\n营销产品及各自进展：${pl}\n客户意向：${d.intent}\n客户整体进展与跟进：${d.overall||'无'}\n\n结构：一、基本信息；二、客户简况（结合调研用2-3句概括，不照抄）；三、营销产品与进展（逐个列进展）；四、客户意向；五、客户整体进展与跟进。`;}
function demoMemo(d){const dt=d.date||new Date().toISOString().slice(0,10);
  const pl=d.prods.length?d.prods.map(p=>`· ${p.name}\n  进展/跟进：${p.prog||'—'}`).join('\n'):'· —';const brief=(d.profile||'—').replace(/\n{2,}/g,'\n').trim();
  return `客户营销纪要\n\n一、基本信息\n机构名称：${d.org||'—'}\n客户名称：${d.client||'—'}\n拜访日期：${dt}\n客户经理：${d.rm||'—'}\n\n二、客户简况\n${brief}\n\n三、营销产品与进展\n${pl}\n\n四、客户意向\n${d.intent||'—'}\n\n五、客户整体进展与跟进\n${d.overall||'—'}\n\n（本纪要由医疗客群AI产品陪练助手生成，供跟进与归档参考；开启AI后自动润色为公文语气。）`;}
function renderMemo(text){const out=document.getElementById('memoOut');
  out.innerHTML=`<div class="memo"><div class="memohd">营销纪要<div class="acts"><button class="cpy" onclick="copyMemo()">复制</button><button class="cpy g" onclick="downloadMemo()">下载</button></div></div><pre id="memoText"></pre></div>`;
  document.getElementById('memoText').textContent=text;}
function copyMemo(){const t=document.getElementById('memoText').textContent;if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('.cpy');const o=b.textContent;b.textContent='已复制';setTimeout(()=>b.textContent=o,1500);});}
function downloadMemo(){const t=document.getElementById('memoText').textContent;const nm=(fv('mOrg')||fv('mClient')||'客户')+'_营销纪要.txt';
  const b=new Blob([t],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nm;a.click();URL.revokeObjectURL(a.href);}

/* ============ 服务方案（对客文档） ============ */
function genProposal(){
  if(!clientProfile){toast("请先在第①步获取客户信息");return;}
  if(!recProducts.length){toast("请先在第②步选择产品");return;}
  const sc=splitClient(clientProfile.name);
  const org=fv('mOrg')||sc.org||clientProfile.name;
  const rm=fv('mRm');const date=(fv('mDate')||new Date().toISOString().slice(0,10)).replace(/-/g,'.');
  const title=(catalogKey()==='authority')?'卫生健康主管部门综合金融服务方案':'医院综合金融服务方案';
  const items=recProducts.map((r,i)=>{const p=findProduct(r.name);
    return `<div class="pitem"><div class="h"><span class="idx">${i+1}</span><span class="nm">${p.name}</span>${p.area?`<span class="ar">${p.area}</span>`:''}</div><p class="ds">${esc(p.desc||'')}</p></div>`;}).join('');
  const brief=plain(clientProfile.text).split('\n').filter(x=>x.trim()).map(x=>`<p>${esc(x)}</p>`).join('');
  document.getElementById('docBox').innerHTML=`<div class="doc">
    <div class="cover"><div class="k">招商银行 · 机构客户部</div><h1>${title}</h1>
      <div class="meta">致：${esc(org)}<br>日期：${date}${rm?`<br>客户经理：${esc(rm)}`:''}</div></div>
    <div class="sec"><h2>一、客户简况</h2>${brief||'<p>—</p>'}</div>
    <div class="sec"><h2>二、推荐服务方案</h2>${items}</div>
    <div class="foot">说明：本方案为招商银行为贵单位定制的金融服务建议，具体功能与合作方式以双方进一步沟通为准。<br>客户简况部分为依据公开信息整理，仅供参考。</div>
  </div>`;
  document.getElementById('proposal').classList.add('show');
}
function closeProposal(){document.getElementById('proposal').classList.remove('show');}

/* ============ 通用 ============ */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function plain(t){return (t||'').replace(/<br>/g,'\n');}
function renderChat(id,hist,drill){const c=document.getElementById(id);if(!c)return;c.innerHTML="";
  hist.forEach(m=>{const d=document.createElement("div");d.className="msg "+(m.role==="user"?"u":"a");
    const who=m.role==="assistant"?(drill?persona().face+" "+persona().label:"AI"):"";
    d.innerHTML=(who?`<div class="who">${who}</div>`:"")+fmt(m.content);c.appendChild(d);});c.scrollTop=c.scrollHeight;}
function pushMsg(id,role,text,who){const c=document.getElementById(id);const e=c.querySelector(".empty");if(e)e.remove();
  const d=document.createElement("div");d.className="msg "+(role==="user"?"u":"a");
  d.innerHTML=(role==="assistant"&&who?`<div class="who">${who}</div>`:"")+fmt(text);c.appendChild(d);c.scrollTop=c.scrollHeight;}
function fmt(t){return (t||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function typing(id){const c=document.getElementById(id);const d=document.createElement("div");d.className="typing";d.id="typing";d.innerHTML="AI思考中<span>.</span><span>.</span><span>.</span>";c.appendChild(d);c.scrollTop=c.scrollHeight;}
function stopTyping(){const t=document.getElementById("typing");if(t)t.remove();}
function kbList(){return allProducts().map(p=>`${p.name}：${(p.desc||'').slice(0,60)}`).join('\n');}
function sysRec(){return `你是招商银行医疗客群产品配置助手。客户画像：\n${plain(clientProfile.text)}\n\n以下是可选产品清单（${activeCat().label}），只能从中挑选：\n`+allProducts().map(p=>`- ${p.name}（${p.area}）：${(p.desc||'').slice(0,50)}`).join('\n');}
async function llm(system,user){return llmChat(system,[{role:"user",content:user}]);}
async function llmChat(system,hist){const url=AI.url.replace(/\/$/,"")+"/v1/chat/completions";
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+AI.key},
    body:JSON.stringify({model:AI.model,messages:[{role:"system",content:system+idInject()},...hist.slice(-8)],temperature:0.7})});
  if(!res.ok)throw new Error("HTTP "+res.status);const j=await res.json();return j.choices?.[0]?.message?.content||"(空回复)";}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ============ 快速导入：上传录音 / 上传文字 → 自动填入表单 ============ */
function uploadMemoAudio(){const i=document.getElementById("memoAudio");if(i){i.value="";i.click();}}
async function onMemoAudio(e){const f=e.target.files[0];if(!f)return;
  busyToast("正在转写录音（文件大较慢，请稍候）…");let text="";
  try{text=await transcribeAudio(f);}catch(err){clearBusy();toast("转写失败："+err.message);return;}
  clearBusy();await ingestToForm(text,"录音");}
async function transcribeAudio(file){if(!ensureKey("GROQ_KEY","Groq"))throw new Error("未提供 Groq API Key");const form=new FormData();
  form.append("file",file);form.append("model",GROQ.model);form.append("language","zh");form.append("response_format","json");
  const r=await fetch(GROQ.url,{method:"POST",headers:{Authorization:"Bearer "+GROQ.key},body:form});
  if(!r.ok){let d="";try{d=(await r.text()).slice(0,150);}catch(e){}throw new Error("HTTP "+r.status+(d?(" "+d):""));}
  const j=await r.json();return j.text||"";}
function openTextInput(){const t=document.getElementById("tiArea");if(t)t.value="";
  document.getElementById("textInputModal").classList.add("show");setTimeout(function(){if(t)t.focus();},50);}
function closeTextInput(){document.getElementById("textInputModal").classList.remove("show");}
function pickTextDoc(){const i=document.getElementById("memoTextFile");if(i){i.value="";i.click();}}
function onMemoTextFile(e){const f=e.target.files[0];if(!f)return;const name=(f.name||"").toLowerCase();
  if(name.endsWith(".txt")){const r=new FileReader();r.onload=function(){appendTi(String(r.result||""));};r.onerror=function(){toast("读取失败");};r.readAsText(f,"utf-8");}
  else if(name.endsWith(".docx")){if(!window.mammoth){toast("需联网加载 docx 组件，请直接粘贴或用 .txt");return;}
    const r=new FileReader();r.onload=function(){window.mammoth.extractRawText({arrayBuffer:r.result}).then(function(res){appendTi(res.value||"");}).catch(function(){toast("docx 解析失败，请直接粘贴");});};
    r.onerror=function(){toast("读取失败");};r.readAsArrayBuffer(f);}
  else if(name.endsWith(".doc")){toast("旧版 .doc 不支持，请另存为 .docx 或直接粘贴");}
  else{toast("仅支持 .txt / .docx");}}
function appendTi(text){const t=document.getElementById("tiArea");if(t){t.value=(t.value?t.value+"\n":"")+String(text||"").trim();t.focus();}}
async function confirmTextInput(){const t=document.getElementById("tiArea");const v=t?t.value.trim():"";
  if(!v){toast("请输入或导入文字");return;}closeTextInput();await ingestToForm(v,"文字");}

/* 把来源文本拆分/填入下方表单 */
async function ingestToForm(text,label){
  if(!text||!text.trim()){toast("内容为空");return;}
  if(useAI){
    busyToast("正在从"+label+"抽取纪要要点并填表…");
    try{
      const raw=await llm(sysExtract(text),"请抽取并只输出JSON。");
      const d=JSON.parse(raw.match(/\{[\s\S]*\}/)[0]);
      fillFormFields(d,text);clearBusy();toastOK("已自动填入表单，请核对后点“生成营销纪要”");
    }catch(err){clearBusy();fillOverallOnly(text,label);toast("AI抽取失败，已填入整体进展，请手动整理");}
  }else{
    fillOverallOnly(text,label);toastOK("已填入“客户整体进展与跟进”（开启AI可自动拆分到各字段）");
  }
}
function sysExtract(text){return "你是招商银行营销纪要信息抽取助手。请从下面的会议记录/文字中抽取要点，严格输出JSON（缺失字段留空字符串或空数组，不要杜撰）：\n{\"org\":\"机构名称\",\"client\":\"客户联系人\",\"date\":\"YYYY-MM-DD或空\",\"rm\":\"客户经理姓名或空\",\"products\":[{\"name\":\"产品名称\",\"prog\":\"该产品进展/跟进\"}],\"intent\":\"意向强/一般/待观望/暂无 四选一\",\"overall\":\"客户整体进展与跟进小结，2-3句\"}\n只输出JSON。\n会议记录：\n"+text;}
function setVal(id,v){const e=document.getElementById(id);if(e&&v)e.value=v;}
function fillFormFields(d,rawText){
  setVal("mOrg",d.org);setVal("mClient",d.client);setVal("mDate",d.date);setVal("mRm",d.rm);
  const intents=["意向强","一般","待观望","暂无"];const sel=document.getElementById("mIntent");
  if(sel&&d.intent){const hit=intents.find(function(x){return d.intent.indexOf(x)>=0;});if(hit)sel.value=hit;}
  if(Array.isArray(d.products)&&d.products.length){const c=document.getElementById("prodRows");if(c)c.innerHTML="";d.products.forEach(function(p){addProdRow(p.name||"",p.prog||"");});}
  setVal("mOverall",d.overall||rawText);
}
function fillOverallOnly(text,label){const ta=document.getElementById("mOverall");if(ta){ta.value=(ta.value?ta.value+"\n":"")+"【"+(label||"来源")+"】\n"+text.trim();ta.focus();ta.scrollTop=ta.scrollHeight;}}
function busyToast(t){clearBusy();const d=document.createElement("div");d.id="busyT";d.textContent=t;
  d.style.cssText="position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ok);color:#0d1b2a;padding:11px 20px;border-radius:9px;font-size:14px;font-weight:600;z-index:120;max-width:80vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)";
  document.body.appendChild(d);return d;}
function clearBusy(){const d=document.getElementById("busyT");if(d)d.remove();}
function toastOK(t){const d=busyToast(t);setTimeout(function(){if(d&&d.parentNode)d.remove();},2600);}

/* ============ 启动 ============ */
document.getElementById("loginName").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
document.getElementById("memoAudio").addEventListener("change",onMemoAudio);
document.getElementById("memoTextFile").addEventListener("change",onMemoTextFile);
document.getElementById("textInputModal").addEventListener("click",e=>{if(e.target.id==="textInputModal")closeTextInput();});
renderStage();
showLogin();
</script>
